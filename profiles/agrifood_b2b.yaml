# Example profile: agri-food B2B suppliers and buyers for a wholesale marketplace.
name: agrifood_b2b
label: Agri-food B2B suppliers & buyers
description: >-
  Agricultural producers, cooperatives, packers, exporters, importers, wholesalers and food
  distributors that trade in bulk with other businesses.

