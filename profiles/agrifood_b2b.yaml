outreach:
  value_proposition: >-
    a B2B marketplace that connects agricultural producers and food suppliers with verified
    professional buyers across Europe
  subject: "B2B buyers for {focus} | {name}"
  relevance_default: >-
    If {focus} is part of your business, there may be a fit on either the buying or the
    selling side.
  relevance_by_type:
    grower: &supply For producers and exporters of {focus}, the platform can be a way to reach professional buyers beyond existing channels.
    cooperative: *supply
    packer: *supply
    exporter: *supply
    food_manufacturer: *supply
    wholesaler: &demand For companies that buy and distribute {focus}, the platform can be a way to source directly from producers and compare offers in one place.
    distributor: *demand
    importer: *demand
    trader: *demand
  signal_lines:
    export: " Since you mention export activity, cross-border buyers may be relevant."

discovery:
  search_terms: [agricultural products wholesaler, fresh produce exporter, food distributor]
