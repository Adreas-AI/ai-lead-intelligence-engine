[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lead-intelligence-engine"
version = "0.1.0"
description = "Describe the businesses you want in plain words; find, enrich, score (explainably) and draft outreach for them."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "structlog>=24.1",
    "openai>=1.40",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36", "pandas>=2.2", "plotly>=5.22"]
dev = ["pytest>=8", "pytest-cov>=5", "respx>=0.21", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: tests that exercise the API and database together",
    "live: tests that call real external services (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "B008",   # FastAPI's Depends() in argument defaults is idiomatic
    "UP047",  # keep TypeVar-style generics for readability
]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_demo_data.py" = ["E501"]  # long literal fixture text
"app/domain/business_catalog.py" = ["E501"]  # one catalog entry per line
"tests/**" = ["E501"]

[tool.coverage.run]
source = ["app"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
